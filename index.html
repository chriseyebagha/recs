<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Recs</title>
  <meta name="description" content="Everything people tell you to try, in one place." />
  <meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Recs" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Sign in -->
  <div id="login" class="login hidden">
    <div class="login-card">
      <img src="icons/icon.svg" class="login-icon" alt="" />
      <h1>Recs</h1>
      <p>Everything people tell you to try, in one place.</p>
      <button id="loginBtn" class="btn-primary">Continue with Google</button>
    </div>
  </div>

  <div id="app" class="hidden">
    <header class="top">
      <button id="backBtn" class="icon-btn hidden" aria-label="Back">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <h1 id="title">Recs</h1>
      <button id="accountBtn" class="avatar" aria-label="Account"></button>
    </header>

    <div id="searchWrap" class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
      <input id="search" type="search" placeholder="Search name, person or place" autocomplete="off" />
    </div>

    <main id="main"></main>

    <!-- Add bar (thumb zone) -->
    <div class="add-bar">
      <div id="picker" class="picker hidden"></div>
      <div id="preview" class="preview hidden"></div>
      <div class="add-row">
        <input id="addInput" type="text" placeholder="Lilia, pasta, from Ana" autocomplete="off" autocapitalize="sentences" enterkeyhint="done" />
        <button id="addBtn" class="add-btn" aria-label="Save">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
      </div>
    </div>
  </div>

  <div id="sheetWrap" class="sheet-wrap">
    <div id="sheet" class="sheet"></div>
  </div>

  <div id="toast" class="toast"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
