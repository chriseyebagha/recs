<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Recs</title>
  <meta name="description" content="Everything people tell you to try, in one place." />
  <meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Recs" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Sign in -->
  <div id="login" class="login hidden">
    <div class="login-card">
      <img src="icons/icon.svg" class="login-icon" alt="" />
      <h1>Recs</h1>
      <p>Everything people tell you to try, in one place.</p>
      <button id="loginBtn" class="btn-primary">Continue with Google</button>
      <p id="loginTip" class="login-tip">On iPhone, open this in Safari, then tap Share and Add to Home Screen to keep it like an app.</p>
    </div>
  </div>

  <div id="app" class="hidden">
    <header class="top" id="top">
      <div class="top-row">
        <button id="backBtn" class="icon-btn back hidden" aria-label="Back">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <h1 id="title">Recs</h1>
        <button id="viewBtn" class="icon-btn round" aria-label="Show map"></button>
        <button id="accountBtn" class="avatar" aria-label="Account"></button>
      </div>
    </header>

    <div id="searchWrap" class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
      <input id="search" type="search" placeholder="Search name, person or place" autocomplete="off" />
    </div>

    <!-- Status and place filters; moved into the map when the map is open -->
    <div id="controls" class="controls">
      <div id="statusSeg" class="seg" role="tablist">
        <button data-status-filter="all">All</button>
        <button data-status-filter="todo">Want to try</button>
        <button data-status-filter="tried">Tried</button>
        <button data-status-filter="loved">Loved</button>
      </div>
      <div class="controls-row">
        <button id="placeBtn" class="place-btn" data-places>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
          <span id="placeLabel">Everywhere</span>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <span class="controls-right">
          <span id="countLabel" class="count-label"></span>
          <button id="shareListBtn" class="share-btn" data-share-list aria-label="Share these">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><polyline points="7.5 7.5 12 3 16.5 7.5"/><path d="M5 11v8a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-8"/></svg>
          </button>
        </span>
      </div>
    </div>

    <main id="main"></main>

    <div id="mapView" class="map-view hidden">
      <div id="map" class="map"></div>
      <div id="mapTop" class="map-top"></div>
      <button id="unpinned" class="unpinned hidden" data-unpinned></button>
      <button id="locateBtn" class="locate" aria-label="Show where I am">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 11 22 2 13 21 11 13 3 11"/></svg>
      </button>
    </div>

    <!-- Add bar (thumb zone) -->
    <div class="add-bar" id="addBar">
      <div id="picker" class="picker chips hidden"></div>
      <div id="preview" class="preview hidden"></div>
      <div class="add-row">
        <input id="addInput" type="text" placeholder="Name in neighborhood, from who" autocomplete="off" autocapitalize="sentences" enterkeyhint="done" />
        <button id="addBtn" class="add-btn" aria-label="Save">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- A list someone shared; works without signing in -->
  <div id="sharedView" class="shared hidden"></div>

  <div id="sheetWrap" class="sheet-wrap">
    <div id="sheet" class="sheet" role="dialog" aria-modal="true" tabindex="-1"></div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
